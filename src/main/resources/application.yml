spring:
  application:
    name: travery
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  config:
    import: optional:file:.env[.properties]

server:
  address: 0.0.0.0

app:
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH}
    app-name: ${FIREBASE_APP_NAME:travery-backend}
